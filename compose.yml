name: diplom_work

services:
  postgres:
    image: postgres:18
    container_name: diplom_work-postgres
    environment:
      POSTGRES_DB: diplom_work
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - diplom_work_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diplom_work_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: diplom_work-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: strongpassword
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - diplom_work_pgadmin_data:/var/lib/pgadmin

    ports:
      - "5050:80"
    networks:
      - diplom_work_network
    restart: unless-stopped


volumes:
  diplom_work_postgres_data:
  diplom_work_pgadmin_data:

networks:
  diplom_work_network: